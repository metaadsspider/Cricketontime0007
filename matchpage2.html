<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crick On Time — Live Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  /* ==========================================================
     DESIGN TOKENS — same palette/type as the Crick On Time
     homepage, so this player page reads as part of one site.
     ========================================================== */
  :root{
    --void:#0A0E0C;         /* page background */
    --panel:#10160F;        /* card / shell background */
    --panel-2:#161D14;      /* slightly lighter panel shade */
    --ink:#F2F1E9;          /* primary text */
    --ink-dim:#9AA79C;      /* muted / secondary text */
    --seam:#C8102E;         /* cricket-ball red — used for LIVE indicators */
    --flood:#D6FF5C;        /* floodlight lime — primary accent / CTAs */
    --line: rgba(242,241,233,0.14); /* hairline borders */
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(214,255,92,0.08), transparent 60%),
      radial-gradient(700px 500px at 95% 10%, rgba(200,16,46,0.10), transparent 60%),
      var(--void);
  }
  .display{ font-family:'Bebas Neue',sans-serif; letter-spacing:0.01em; line-height:0.95; } /* broadcast/scoreboard display type, matches homepage */
  .wrap{ max-width:1180px; margin:auto; padding:20px; }

  /* ==========================================================
     HEADER — flexbox row: brand left, links center, live badge
     right. Same component shapes as the homepage nav.
     ========================================================== */
  header{
    display:flex; align-items:center; justify-content:space-between;
    gap:20px; padding:22px 0 22px; border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; } /* FLEXBOX: logo dot + wordmark */
  .brand-mark{
    width:16px; height:16px; border-radius:50%;
    background: var(--seam); position:relative; flex:none;
  }
  .brand-mark::before,.brand-mark::after{ /* seam-stitch curves on the logo dot */
    content:""; position:absolute; inset:2px;
    border:1px solid rgba(242,241,233,0.85);
    border-radius:50%;
    clip-path: inset(0 50% 0 0);
  }
  .brand-mark::after{ clip-path: inset(0 0 0 50%); transform:rotate(35deg); }
  .brand-name{ font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.06em; color:var(--ink); }
  .brand-name b{ color:var(--flood); font-weight:400; }

  nav.links{ display:flex; gap:28px; } /* FLEXBOX: nav link row, hidden on small screens */
  nav.links a{ color:var(--ink-dim); text-decoration:none; font-size:14px; font-weight:500; transition:color .2s ease; }
  nav.links a:hover{ color:var(--ink); }

  .badge{
    display:inline-flex; align-items:center; gap:8px; /* FLEXBOX: pulsing dot + label */
    border:1px solid var(--seam); border-radius:999px;
    padding:7px 14px; font-size:12px; font-weight:700; color:var(--ink);
  }
  .badge .dot{ width:7px; height:7px; border-radius:50%; background:var(--seam); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

  /* ==========================================================
     PLAYER SHELL — the video stage + control bar
     ========================================================== */
  .player-shell{
    margin-top:28px; background:#060907;
    border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:0 24px 70px rgba(0,0,0,0.5);
  }
  .stage{ position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden; }
  .stage iframe{ width:100%; height:100%; display:block; border:0; background:#000; }

  .loading{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; /* FLEXBOX: spinner + label, centered */
    background:#06090A; color:var(--ink); z-index:2;
    pointer-events:none; transition:opacity .35s ease;
  }
  .loading.hidden{ opacity:0; }
  .spinner{
    width:34px; height:34px; border:3px solid #26332D;
    border-top-color:var(--flood); border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:800px){
    .wrap{ padding:14px; }
    nav.links{ display:none; }
  }

  /* ==========================================================
     TELEGRAM POPUP — modal overlay, shown periodically
     ========================================================== */
  .tg-overlay{
    position:fixed; inset:0; z-index:1000;
    background:rgba(6,9,7,0.72);
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; /* FLEXBOX: center the card */
    padding:20px;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .tg-overlay.show{ opacity:1; pointer-events:auto; }

  .tg-card{
    width:100%; max-width:360px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 24px 24px;
    text-align:center;
    box-shadow:0 24px 70px rgba(0,0,0,0.55);
    transform:translateY(8px) scale(.98);
    transition:transform .25s ease;
  }
  .tg-overlay.show .tg-card{ transform:translateY(0) scale(1); }

  .tg-icon{
    width:56px; height:56px; margin:0 auto 14px;
    border-radius:50%;
    background:linear-gradient(135deg,#2AABEE,#229ED9);
    display:flex; align-items:center; justify-content:center; /* FLEXBOX: center paper-plane glyph */
  }
  .tg-icon svg{ width:28px; height:28px; fill:#fff; }

  .tg-title{ font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:0.03em; color:var(--ink); margin:0 0 6px; }
  .tg-sub{ font-size:14px; color:var(--ink-dim); margin:0 0 20px; line-height:1.5; }

  .tg-join{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; /* FLEXBOX: icon + label on the button */
    width:100%; padding:13px 18px;
    background:var(--flood); color:#0A0E0C;
    font-weight:700; font-size:14px; text-decoration:none;
    border-radius:10px; letter-spacing:0.02em;
    transition:filter .15s ease;
  }
  .tg-join:hover{ filter:brightness(1.08); }

  .tg-dismiss{
    margin-top:12px;
    background:none; border:0; cursor:pointer;
    color:var(--ink-dim); font-size:13px;
    font-family:inherit;
  }
  .tg-dismiss:hover{ color:var(--ink); }
</style>
</head>

<body>
<div class="wrap">

  <!-- =========================================================
       HEADER — flexbox: brand, nav links, live badge
       ========================================================= -->
  <header>
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">CRICK <b>ON TIME</b></span>
    </div>

    <nav class="links">
      <a href="#">Live Matches</a>
      <a href="#">Schedule</a>
      <a href="#">Highlights</a>
    </nav>

    <div class="badge">
      <span class="dot"></span>
      LIVE NOW
    </div>
  </header>

  <!-- =========================================================
       PLAYER SHELL — video stage + control bar
       ========================================================= -->
  <section class="player-shell">

    <div class="stage">

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Loading live stream…</div>
      </div>

      <iframe
        id="streamFrame"
        src="https://asian-games.yashublitzz.workers.dev/"
        title="Live Cricket Stream"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen
        referrerpolicy="no-referrer">
      </iframe>

    </div>

  </section>

</div>

<!-- =========================================================
     TELEGRAM JOIN POPUP — hidden by default, toggled by JS
     ========================================================= -->
<div class="tg-overlay" id="tgOverlay">
  <div class="tg-card">
    <div class="tg-icon">
      <svg viewBox="0 0 24 24"><path d="M21.05 2.93 2.3 10.4c-1.24.5-1.23 1.2-.23 1.5l4.8 1.5 1.85 5.62c.22.6.4.85.8.85.35 0 .5-.16.7-.35l1.9-1.83 4.7 3.47c.9.5 1.5.24 1.75-.83l3.15-14.85c.36-1.32-.5-1.9-1.62-1.55Z"/></svg>
    </div>
    <h3 class="tg-title">Join Us on Telegram</h3>
    <p class="tg-sub">Get instant match alerts, backup stream links &amp; updates straight from our channel.</p>
    <a class="tg-join" href="https://t.me/+u4SlkLZNQl9hZjQ1" target="_blank" rel="noopener">Join Telegram Channel</a>
    <button class="tg-dismiss" id="tgDismiss">Maybe later</button>
  </div>
</div>

<script>
  /* ---- Loading overlay: hide once the iframe reports it has loaded ---- */
  const frame = document.getElementById("streamFrame");
  const loading = document.getElementById("loading");

  frame.addEventListener("load", () => {
    loading.classList.add("hidden");
  });

  /* ---- Telegram join popup: show on load, then every 40 minutes ---- */
  const TG_INTERVAL_MS = 40 * 60 * 1000; // 40 minutes
  const tgOverlay = document.getElementById("tgOverlay");
  const tgDismiss = document.getElementById("tgDismiss");

  function showTgPopup(){
    tgOverlay.classList.add("show");
  }
  function hideTgPopup(){
    tgOverlay.classList.remove("show");
  }

  tgDismiss.addEventListener("click", hideTgPopup);
  tgOverlay.addEventListener("click", (e) => {
    if (e.target === tgOverlay) hideTgPopup(); // click outside card closes it
  });

  // Show once shortly after page load, then repeat every 40 minutes.
  setTimeout(showTgPopup, 3000);
  setInterval(showTgPopup, TG_INTERVAL_MS);
</script>

</body>
</html>
