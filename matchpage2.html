<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crick On Time — Live Player</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --void:#0A0E0C;
  --panel:#10160F;
  --panel-2:#161D14;
  --ink:#F2F1E9;
  --ink-dim:#9AA79C;
  --seam:#C8102E;
  --flood:#D6FF5C;
  --line:rgba(242,241,233,0.14);

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{
  box-sizing:inherit;
}

html{
  scroll-padding-top:env(safe-area-inset-top,0px);
}

body{
  margin:0;
  min-height:100vh;
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  background:
    radial-gradient(
      1100px 600px at 85% -10%,
      rgba(214,255,92,0.08),
      transparent 60%
    ),
    radial-gradient(
      700px 500px at 95% 10%,
      rgba(200,16,46,0.10),
      transparent 60%
    ),
    var(--void);

  user-select:none;
  -webkit-user-select:none;
}

.display{
  font-family:'Bebas Neue',sans-serif;
  letter-spacing:.01em;
  line-height:.95;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:20px;
}

/* HEADER */

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  padding:22px 0;
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:16px;
  height:16px;
  border-radius:50%;
  background:var(--seam);
  position:relative;
  flex:none;
}

.brand-mark::before,
.brand-mark::after{
  content:"";
  position:absolute;
  inset:2px;
  border:1px solid rgba(242,241,233,.85);
  border-radius:50%;
  clip-path:inset(0 50% 0 0);
}

.brand-mark::after{
  clip-path:inset(0 0 0 50%);
  transform:rotate(35deg);
}

.brand-name{
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;
  letter-spacing:.06em;
  color:var(--ink);
}

.brand-name b{
  color:var(--flood);
  font-weight:400;
}

nav.links{
  display:flex;
  gap:28px;
}

nav.links a{
  color:var(--ink-dim);
  text-decoration:none;
  font-size:14px;
  font-weight:500;
  transition:color .2s ease;
}

nav.links a:hover{
  color:var(--ink);
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--seam);
  border-radius:999px;
  padding:7px 14px;
  font-size:12px;
  font-weight:700;
  color:var(--ink);
}

.badge .dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--seam);
  animation:pulse 1.6s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.35}
}

/* PLAYER */

.player-shell{
  margin-top:28px;
  background:#060907;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 24px 70px rgba(0,0,0,.5);
}

.stage{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
}

.stage iframe{
  width:100%;
  height:100%;
  display:block;
  border:0;
  background:#000;
}

.loading{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
  background:#06090A;
  color:var(--ink);
  z-index:2;
  pointer-events:none;
  transition:opacity .35s ease;
}

.loading.hidden{
  opacity:0;
}

.spinner{
  width:34px;
  height:34px;
  border:3px solid #26332D;
  border-top-color:var(--flood);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* SECURITY ERROR SCREEN */

#securityBlock{
  display:none;
  position:fixed;
  inset:0;
  z-index:999999999;
  width:100%;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:
    radial-gradient(
      800px 500px at 50% 0%,
      rgba(200,16,46,.14),
      transparent 65%
    ),
    #080B09;
}

.security-card{
  width:min(520px,100%);
  padding:42px 32px;
  text-align:center;
  background:var(--panel);
  border:1px solid rgba(200,16,46,.45);
  border-radius:16px;
  box-shadow:0 30px 100px rgba(0,0,0,.65);
}

.security-icon{
  width:58px;
  height:58px;
  margin:0 auto 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(200,16,46,.12);
  border:1px solid var(--seam);
  color:var(--seam);
  font-size:27px;
  font-weight:800;
}

.security-title{
  margin:0 0 12px;
  font-family:'Bebas Neue',sans-serif;
  font-size:38px;
  letter-spacing:.04em;
  color:var(--ink);
}

.security-text{
  margin:0;
  color:var(--ink-dim);
  line-height:1.65;
  font-size:14px;
}

.security-note{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid var(--line);
  color:#737E75;
  font-size:12px;
}

@media(max-width:800px){
  .wrap{
    padding:14px;
  }

  nav.links{
    display:none;
  }

  header{
    padding:18px 0;
  }

  .security-card{
    padding:34px 22px;
  }
}
</style>

</head>

<body>

<div class="wrap" id="mainPage">

  <header>
    <div class="brand">
      <span class="brand-mark"></span>

      </span>
    </div>

<p class="security-text" id="securityMessage">

<script>
(function(){

  "use strict";

  let securityTriggered = false;

  const mainPage =
    document.getElementById("mainPage");

  const securityBlock =
    document.getElementById("securityBlock");

  const securityMessage =
    document.getElementById("securityMessage");

  /*
   * SECURITY BLOCK
   */

  function blockPage(message){

    if(securityTriggered) return;

    securityTriggered = true;

    if(securityMessage){
      securityMessage.textContent =
        message ||
        "Unauthorized browser inspection has been detected.";
    }

    if(mainPage){
      mainPage.style.display = "none";
    }

    if(securityBlock){
      securityBlock.style.display = "flex";
    }

    /*
     * Stop the player from continuing to load.
     */
    const frame =
      document.getElementById("streamFrame");

    if(frame){
      frame.src = "about:blank";
    }

    /*
     * Clear page selection.
     */
    try{
      window.getSelection()?.removeAllRanges();
    }catch(e){}

  }


  /*
   * RIGHT CLICK
   */

  document.addEventListener(
    "contextmenu",
    function(e){
      e.preventDefault();
      e.stopPropagation();
      return false;
    },
    true
  );


  /*
   * TEXT SELECTION
   */

  document.addEventListener(
    "selectstart",
    function(e){
      e.preventDefault();
      return false;
    },
    true
  );


  /*
   * DRAGGING
   */

  document.addEventListener(
    "dragstart",
    function(e){
      e.preventDefault();
      return false;
    },
    true
  );


  /*
   * KEYBOARD SHORTCUT PROTECTION
   *
   * F12
   * Ctrl + Shift + I
   * Ctrl + Shift + J
   * Ctrl + Shift + C
   * Ctrl + U
   * Cmd + Option + I
   * Cmd + Option + J
   * Cmd + Option + C
   */

  document.addEventListener(
    "keydown",
    function(e){

      const key =
        String(e.key || "").toLowerCase();

      const ctrl =
        e.ctrlKey || e.metaKey;

      const shift =
        e.shiftKey;

      const alt =
        e.altKey;

      let blocked = false;

      if(key === "f12"){
        blocked = true;
      }

      if(ctrl && shift &&
        ["i","j","c"].includes(key)){
        blocked = true;
      }

      if(ctrl && key === "u"){
        blocked = true;
      }

      if(
        (e.metaKey && alt &&
          ["i","j","c"].includes(key))
      ){
        blocked = true;
      }

      /*
       * Ctrl + Shift + K
       * Firefox developer*
