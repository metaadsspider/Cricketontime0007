<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crick On Time — Live Cricket Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   DESIGN TOKENS
========================================================== */
:root{
  --void:#0A0E0C;
  --ink:#F2F1E9;
  --ink-dim:#9AA79C;
  --seam:#C8102E;
  --flood:#D6FF5C;
  --line: rgba(242,241,233,0.14);
}
*, *::before, *::after{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
html, body{ height:100%; }
body{
  margin:0;
  background: var(--void);
  color: var(--ink);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
}
img,svg{ max-width:100%; display:block; }
.wrap{ max-width:1240px; margin:0 auto; padding:0 32px; }
.display{ font-family:'Bebas Neue',sans-serif; letter-spacing:0.01em; line-height:0.92; }

/* ==========================================================
   NAV BAR
========================================================== */
header.nav{
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding-top: env(safe-area-inset-top, 0px);
  background: linear-gradient(to bottom, rgba(6,9,7,0.65), rgba(6,9,7,0));
  transition: background .4s ease, backdrop-filter .4s ease, box-shadow .4s ease;
}
header.nav.scrolled{
  background: rgba(9,13,10,0.86);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 1px 0 var(--line);
}
.nav-row{
  display:flex; align-items:center; justify-content:space-between;
  height:78px;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:16px; height:16px; border-radius:50%;
  background: var(--seam);
  position:relative; flex-shrink:0;
}
.brand-mark::before,.brand-mark::after{
  content:""; position:absolute; inset:2px;
  border:1px solid rgba(242,241,233,0.85);
  border-radius:50%;
  clip-path: inset(0 50% 0 0);
}
.brand-mark::after{ clip-path: inset(0 0 0 50%); transform: rotate(35deg); }
.brand-name{ font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.06em; color: var(--ink); }
.brand-name b{ color: var(--flood); font-weight:400; }
.nav-cta{ display:flex; align-items:center; gap:14px; }

.btn{
  display:inline-flex; align-items:center; gap:8px;
  font-family:'Inter',sans-serif; font-weight:700; font-size:14px;
  padding:12px 22px; border-radius:3px; border:1px solid transparent;
  cursor:pointer; text-decoration:none; white-space:nowrap;
  transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease;
}
.btn:active{ transform: translateY(1px); }
.btn-primary{ background: var(--flood); color:#0A0E0C; }
.btn-primary:hover{ background:#E4FF86; }

/* ==========================================================
   HERO + AUTO SLIDER
========================================================== */
.hero{
  position:relative; height:100svh; min-height:560px; width:100%;
  overflow:hidden;
  background: var(--void);
}
.slide{
  position:absolute; inset:0;
  opacity:0; visibility:hidden;
  transition: opacity 1.1s ease;
}
.slide.active{ opacity:1; visibility:visible; z-index:1; }

.visual-landscape,
.visual-portrait{ position:absolute; inset:0; }
.visual-landscape{ display:block; }
.visual-portrait{ display:none; }
@media (orientation: portrait){
  .visual-landscape{ display:none; }
  .visual-portrait{ display:block; }
}

.slide-scrim{
  position:absolute; inset:0; z-index:1;
  background: linear-gradient(100deg, rgba(8,11,9,0.94) 0%, rgba(8,11,9,0.78) 32%, rgba(8,11,9,0.35) 58%, rgba(8,11,9,0.15) 100%),
              linear-gradient(to top, rgba(6,9,7,0.9) 0%, rgba(6,9,7,0) 32%);
}
@media (orientation: portrait){
  .slide-scrim{
    background: linear-gradient(to top, rgba(6,9,7,0.96) 0%, rgba(6,9,7,0.55) 45%, rgba(6,9,7,0.25) 75%);
  }
}

/* gradient fills (used when no image is supplied via JSON) */
.bg-1.visual-landscape{
  background:
    radial-gradient(1100px 600px at 78% -10%, rgba(214,255,92,0.16), transparent 60%),
    radial-gradient(700px 500px at 92% 8%, rgba(200,16,46,0.18), transparent 60%),
    linear-gradient(180deg, #0B120E 0%, #0E1710 55%, #0A0E0C 100%);
}
.bg-2.visual-landscape{
  background:
    radial-gradient(60% 70% at 82% 45%, rgba(200,16,46,0.35), transparent 65%),
    linear-gradient(150deg, #0C0E0B 0%, #14100E 45%, #0A0E0C 100%);
}
.bg-3.visual-landscape{
  background:
    radial-gradient(900px 500px at 15% 100%, rgba(214,255,92,0.10), transparent 60%),
    linear-gradient(180deg, #0A130D 0%, #0D1712 60%, #0A0E0C 100%);
}
.bg-1.visual-portrait{
  background:
    radial-gradient(700px 500px at 50% -5%, rgba(214,255,92,0.18), transparent 60%),
    radial-gradient(500px 400px at 50% 15%, rgba(200,16,46,0.16), transparent 60%),
    linear-gradient(180deg, #0B120E 0%, #0E1710 55%, #0A0E0C 100%);
}
.bg-2.visual-portrait{
  background:
    radial-gradient(70% 40% at 50% 30%, rgba(200,16,46,0.35), transparent 65%),
    linear-gradient(200deg, #0C0E0B 0%, #14100E 45%, #0A0E0C 100%);
}
.bg-3.visual-portrait{
  background:
    radial-gradient(600px 700px at 50% 100%, rgba(214,255,92,0.12), transparent 60%),
    linear-gradient(180deg, #0A130D 0%, #0D1712 60%, #0A0E0C 100%);
}

.slide-svg{ position:absolute; inset:0; width:100%; height:100%; }

.hero-content{
  position:relative; z-index:2; height:100%;
  display:flex; align-items:center;
}
@media (orientation: portrait){
  .hero-content{ align-items:flex-end; padding-bottom:110px; }
}
.hero-inner{ max-width:640px; padding-top:40px; }
.eyebrow{
  display:flex; align-items:center; gap:10px;
  color: var(--flood); font-size:13px; font-weight:600;
  letter-spacing:.04em; margin-bottom:18px;
}
.eyebrow .seam-line{ width:34px; height:1px; background: var(--flood); position:relative; }
.eyebrow .seam-line::before{
  content:""; position:absolute; inset:0;
  background-image: repeating-linear-gradient(90deg, var(--flood) 0 3px, transparent 3px 7px);
}
.hero-title{ font-size: clamp(40px, 7vw, 96px); color: var(--ink); margin:0 0 22px 0; }
.hero-title .accent{ color: var(--flood); }
.hero-sub{
  font-size:17px; line-height:1.6; color: var(--ink-dim);
  max-width:480px; margin:0 0 34px 0;
}
.hero-actions{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }

.slide-index{
  position:absolute; z-index:3; left:32px; bottom:32px;
  display:flex; align-items:center; gap:14px;
}
.slide-index .num{
  font-family:'Bebas Neue',sans-serif; font-size:15px;
  color: var(--ink-dim); letter-spacing:.05em;
}
.dots{ display:flex; gap:8px; }
.dot-btn{
  width:26px; height:3px;
  background: rgba(242,241,233,0.25);
  border:none; cursor:pointer; padding:0;
  transition: background .2s ease;
}
.dot-btn.active{ background: var(--flood); }

@media (max-width:860px){
  .wrap{ padding:0 20px; }
  .slide-index{ left:20px; bottom:24px; }
}

@media (prefers-reduced-motion: reduce){
  .slide{ transition:none; }
}
</style>
</head>
<body>

<!-- =========================================================
     NAV BAR
========================================================= -->
<header class="nav" id="siteNav">
  <div class="wrap nav-row">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">CRICK <b>ON TIME</b></span>
    </div>
    <div class="nav-cta">
      <a href="https://t.me/+u4SlkLZNQl9hZjQ1" target="_blank" rel="noopener" class="btn btn-primary">Join for More</a>
    </div>
  </div>
</header>

<!-- =========================================================
     HERO + AUTO SLIDER
========================================================= -->
<section class="hero" id="home">

  <!-- SLIDE 1 -->
  <div class="slide active" data-slide="0">
    <div class="visual-landscape bg-1">
      <svg class="slide-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <g opacity="0.5">
          <polygon points="1010,900 1060,120 1080,120 1160,900" fill="#D6FF5C" opacity="0.05"/>
          <polygon points="1160,900 1200,180 1216,180 1300,900" fill="#D6FF5C" opacity="0.04"/>
          <polygon points="1300,900 1330,220 1344,220 1420,900" fill="#D6FF5C" opacity="0.035"/>
        </g>
        <circle cx="1070" cy="110" r="5" fill="#D6FF5C"/>
        <circle cx="1208" cy="170" r="4" fill="#D6FF5C" opacity="0.8"/>
        <circle cx="1337" cy="210" r="3.5" fill="#D6FF5C" opacity="0.7"/>
        <path d="M0 780 C 300 760, 700 800, 1440 760 L1440 900 L0 900 Z" fill="#060907" opacity="0.9"/>
        <path d="M0 800 C 320 785, 680 815, 1440 785" stroke="#D6FF5C" stroke-width="1" opacity="0.18" fill="none"/>
      </svg>
    </div>
    <div class="visual-portrait bg-1">
      <svg class="slide-svg" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <g opacity="0.5">
          <polygon points="330,1400 380,80 420,80 470,1400" fill="#D6FF5C" opacity="0.05"/>
          <polygon points="230,1400 300,140 340,140 410,1400" fill="#D6FF5C" opacity="0.04"/>
          <polygon points="430,1400 460,140 500,140 570,1400" fill="#D6FF5C" opacity="0.04"/>
        </g>
        <circle cx="400" cy="70" r="6" fill="#D6FF5C"/>
        <circle cx="320" cy="130" r="4" fill="#D6FF5C" opacity="0.8"/>
        <circle cx="480" cy="130" r="4" fill="#D6FF5C" opacity="0.7"/>
        <path d="M0 1180 C 200 1150, 600 1210, 800 1170 L800 1400 L0 1400 Z" fill="#060907" opacity="0.9"/>
        <path d="M0 1200 C 220 1180, 580 1230, 800 1190" stroke="#D6FF5C" stroke-width="1" opacity="0.18" fill="none"/>
      </svg>
    </div>
    <div class="slide-scrim"></div>
  </div>

  <!-- SLIDE 2 -->
  <div class="slide" data-slide="1">
    <div class="visual-landscape bg-2">
      <svg class="slide-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <circle cx="1180" cy="420" r="360" fill="none" stroke="#C8102E" stroke-width="2" opacity="0.55"/>
        <path d="M900 300 Q1180 60 1460 300" stroke="#F2F1E9" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="2 10" stroke-linecap="round"/>
        <path d="M900 540 Q1180 780 1460 540" stroke="#F2F1E9" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="2 10" stroke-linecap="round"/>
        <circle cx="1180" cy="420" r="230" fill="none" stroke="#C8102E" stroke-width="1" opacity="0.3"/>
      </svg>
    </div>
    <div class="visual-portrait bg-2">
      <svg class="slide-svg" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <circle cx="400" cy="500" r="320" fill="none" stroke="#C8102E" stroke-width="2" opacity="0.55"/>
        <path d="M180 320 Q400 100 620 320" stroke="#F2F1E9" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="2 10" stroke-linecap="round"/>
        <path d="M180 680 Q400 900 620 680" stroke="#F2F1E9" stroke-width="2" fill="none" opacity="0.5" stroke-dasharray="2 10" stroke-linecap="round"/>
        <circle cx="400" cy="500" r="200" fill="none" stroke="#C8102E" stroke-width="1" opacity="0.3"/>
      </svg>
    </div>
    <div class="slide-scrim"></div>
  </div>

  <!-- SLIDE 3 -->
  <div class="slide" data-slide="2">
    <div class="visual-landscape bg-3">
      <svg class="slide-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <line x1="820" y1="0" x2="820" y2="900" stroke="#F2F1E9" stroke-width="1.5" opacity="0.15"/>
        <line x1="760" y1="0" x2="760" y2="900" stroke="#F2F1E9" stroke-width="1" opacity="0.1"/>
        <line x1="880" y1="0" x2="880" y2="900" stroke="#F2F1E9" stroke-width="1" opacity="0.1"/>
        <rect x="790" y="60" width="60" height="10" fill="#D6FF5C" opacity="0.5"/>
        <rect x="790" y="820" width="60" height="10" fill="#D6FF5C" opacity="0.5"/>
        <circle cx="1250" cy="200" r="2" fill="#D6FF5C"/>
        <circle cx="1310" cy="340" r="2" fill="#D6FF5C" opacity="0.7"/>
        <circle cx="1180" cy="470" r="2" fill="#D6FF5C" opacity="0.5"/>
      </svg>
    </div>
    <div class="visual-portrait bg-3">
      <svg class="slide-svg" viewBox="0 0 800 1400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="460" x2="800" y2="460" stroke="#F2F1E9" stroke-width="1.5" opacity="0.15"/>
        <line x1="0" y1="400" x2="800" y2="400" stroke="#F2F1E9" stroke-width="1" opacity="0.1"/>
        <line x1="0" y1="520" x2="800" y2="520" stroke="#F2F1E9" stroke-width="1" opacity="0.1"/>
        <rect x="370" y="430" width="10" height="60" fill="#D6FF5C" opacity="0.5"/>
        <rect x="420" y="430" width="10" height="60" fill="#D6FF5C" opacity="0.5"/>
        <circle cx="250" cy="700" r="2.5" fill="#D6FF5C"/>
        <circle cx="520" cy="800" r="2.5" fill="#D6FF5C" opacity="0.7"/>
        <circle cx="380" cy="900" r="2.5" fill="#D6FF5C" opacity="0.5"/>
      </svg>
    </div>
    <div class="slide-scrim"></div>
  </div>

  <!-- text overlay — content comes from crick-on-time-content.json -->
  <div class="hero-content wrap">
    <div class="hero-inner">
      <div class="eyebrow"><span class="seam-line"></span> <span id="slideEyebrow">LIVE CRICKET, ZERO DELAY</span></div>
      <h1 class="hero-title display" id="slideTitle"></h1>
      <p class="hero-sub" id="slideSub"></p>
      <div class="hero-actions">
        <a href="https://t.me/+u4SlkLZNQl9hZjQ1" target="_blank" rel="noopener" class="btn btn-primary" id="slideCta">Join for More</a>
      </div>
    </div>
  </div>

  <div class="slide-index">
    <span class="num">01 / 03</span>
    <div class="dots">
      <button class="dot-btn active" data-goto="0" aria-label="Slide 1"></button>
      <button class="dot-btn" data-goto="1" aria-label="Slide 2"></button>
      <button class="dot-btn" data-goto="2" aria-label="Slide 3"></button>
    </div>
  </div>
</section>

<script>
  /* =====================================================
     TELEGRAM LINK — used for the hero CTA on every slide
  ====================================================== */
  const TELEGRAM_URL = 'https://t.me/+u4SlkLZNQl9hZjQ1';
  const TELEGRAM_TEXT = 'Join for More';

  /* ---- Fallback content (shown if the JSON fails to load) ---- */
  const DEFAULT_SLIDES = [
    {
      eyebrow: 'LIVE CRICKET, ZERO DELAY',
      titleHtml: 'Every Ball.<br>Every Match.<br><span class="accent">On Time.</span>',
      subtitle: 'Stream every international and T20 league match in crisp HD. Join our Telegram channel and get live links the moment play begins.'
    },
    {
      eyebrow: 'HD STREAMS, EVERY MATCH',
      titleHtml: 'No Buffer.<br>No Blackout.<br><span class="accent">All Matches.</span>',
      subtitle: 'From the first over to the final ball — working stream links for every game, delivered straight to your phone.'
    },
    {
      eyebrow: 'JOIN FREE, WATCH INSTANTLY',
      titleHtml: 'Your Team.<br>Live Now.<br><span class="accent">Tap Join.</span>',
      subtitle: 'No sign-ups, no paywalls. Join the channel and never miss a single match again.'
    }
  ];

  const slides    = document.querySelectorAll('.slide');
  const dots      = document.querySelectorAll('.dot-btn');
  const slideNum  = document.querySelector('.slide-index .num');
  const titleEl   = document.getElementById('slideTitle');
  const subEl     = document.getElementById('slideSub');
  const eyebrowEl = document.getElementById('slideEyebrow');
  const ctaEl     = document.getElementById('slideCta');

  let content = DEFAULT_SLIDES;
  let current = 0;
  let timer   = null;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- apply JSON images to each slide (landscape + portrait) ---- */
  function applySlideImages(slideData){
    slides.forEach((slide, index) => {
      const item = slideData[index];
      if (!item) return;

      const landscape = slide.querySelector('.visual-landscape');
      const portrait  = slide.querySelector('.visual-portrait');

      if (item.landscapeImage) {
        landscape.style.backgroundImage = `url("${item.landscapeImage}")`;
        landscape.style.backgroundSize  = 'cover';
        landscape.style.backgroundPosition = 'center';
        const svg = landscape.querySelector('svg');
        if (svg) svg.style.display = 'none';
      }

      if (item.portraitImage) {
        portrait.style.backgroundImage = `url("${item.portraitImage}")`;
        portrait.style.backgroundSize  = 'cover';
        portrait.style.backgroundPosition = 'center';
        const svg = portrait.querySelector('svg');
        if (svg) svg.style.display = 'none';
      }
    });
  }

  /* ---- render a slide's text content ---- */
  function goTo(i){
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');

    current = i;

    slides[current].classList.add('active');
    dots[current].classList.add('active');

    slideNum.textContent =
      '0' + (current + 1) + ' / ' + String(slides.length).padStart(2, '0');

    const slide = content[current] || {};

    eyebrowEl.textContent = slide.eyebrow || 'LIVE CRICKET, ZERO DELAY';
    titleEl.innerHTML     = slide.titleHtml || slide.title || DEFAULT_SLIDES[current % DEFAULT_SLIDES.length].titleHtml;
    subEl.textContent     = slide.subtitle || slide.sub || DEFAULT_SLIDES[current % DEFAULT_SLIDES.length].subtitle;

    /* hero CTA always points to the Telegram channel */
    ctaEl.textContent = slide.ctaText || TELEGRAM_TEXT;
    ctaEl.href        = TELEGRAM_URL;
    ctaEl.target      = '_blank';
    ctaEl.rel         = 'noopener';
  }

  function next(){
    goTo((current + 1) % slides.length);
  }

  function startAuto(ms){
    if (reduceMotion) return;
    stopAuto();
    timer = setInterval(next, ms || 5500);
  }

  function stopAuto(){
    clearInterval(timer);
  }

  dots.forEach(btn => {
    btn.addEventListener('click', () => {
      stopAuto();
      goTo(parseInt(btn.dataset.goto, 10));
      startAuto();
    });
  });

  /* show fallback immediately, then upgrade if JSON loads */
  goTo(0);
  startAuto(5500);

  /* =====================================================
     FETCH HERO CONTENT FROM crick-on-time-content.json
  ====================================================== */
  fetch('crick-on-time-content.json')
    .then(response => {
      if (!response.ok) {
        throw new Error('Could not load crick-on-time-content.json (status ' + response.status + ')');
      }
      return response.json();
    })
    .then(data => {
      const hero = data.hero || {};
      const jsonSlides = Array.isArray(hero.slides) ? hero.slides : [];

      if (jsonSlides.length) {
        content = jsonSlides.map((s, i) => ({
          eyebrow:   s.eyebrow   || hero.eyebrow || DEFAULT_SLIDES[i % DEFAULT_SLIDES.length].eyebrow,
          titleHtml: s.titleHtml || s.title      || DEFAULT_SLIDES[i % DEFAULT_SLIDES.length].titleHtml,
          subtitle:  s.subtitle  || s.sub        || DEFAULT_SLIDES[i % DEFAULT_SLIDES.length].subtitle,
          landscapeImage: s.landscapeImage,
          portraitImage:  s.portraitImage
        }));

        applySlideImages(content);
        goTo(0);
        startAuto(hero.autoPlayMs || 5500);
      }
    })
    .catch(error => {
      console.warn('Using fallback hero content:', error.message);
    });
</script>

</body>
</html>
