<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crick On Time — Live Cricket Streaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0A0E0C;
  --ink:#F2F1E9;
  --ink-dim:#9AA79C;
  --seam:#C8102E;
  --flood:#D6FF5C;
  --line: rgba(242,241,233,0.14);
}
*, *::before, *::after{ box-sizing: border-box; }
html{ scroll-behavior: smooth; }
html, body{ height:100%; }
body{
  margin:0;
  background: var(--void);
  color: var(--ink);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
}
img,svg{ max-width:100%; display:block; }
.wrap{ max-width:1240px; margin:0 auto; padding:0 32px; }
.display{ font-family:'Bebas Neue',sans-serif; letter-spacing:0.01em; line-height:0.92; }

/* ---- NAV ---- */
header.nav{
  position:fixed; top:0; left:0; right:0; z-index:100;
  padding-top: env(safe-area-inset-top, 0px);
  background: linear-gradient(to bottom, rgba(6,9,7,0.65), rgba(6,9,7,0));
  transition: background .4s ease, backdrop-filter .4s ease, box-shadow .4s ease;
}
header.nav.scrolled{
  background: rgba(9,13,10,0.86);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 1px 0 var(--line);
}
.nav-row{
  display:flex; align-items:center; justify-content:space-between;
  height:78px;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  width:16px; height:16px; border-radius:50%;
  background: var(--seam);
  position:relative; flex-shrink:0;
}
.brand-mark::before,.brand-mark::after{
  content:""; position:absolute; inset:2px;
  border:1px solid rgba(242,241,233,0.85);
  border-radius:50%;
  clip-path: inset(0 50% 0 0);
}
.brand-mark::after{ clip-path: inset(0 0 0 50%); transform: rotate(35deg); }
.brand-name{ font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:0.06em; color: var(--ink); }
.brand-name b{ color: var(--flood); font-weight:400; }
.nav-cta{ display:flex; align-items:center; gap:14px; }

/* ---- BUTTONS ---- */
.btn{
  display:inline-flex; align-items:center; gap:8px;
  font-family:'Inter',sans-serif; font-weight:700; font-size:14px;
  padding:12px 22px; border-radius:3px; border:1px solid transparent;
  cursor:pointer; text-decoration:none; white-space:nowrap;
  transition: transform .15s ease, background .2s ease, color .2s ease, border-color .2s ease;
}
.btn:active{ transform: translateY(1px); }
.btn-primary{ background: var(--flood); color:#0A0E0C; }
.btn-primary:hover{ background:#E4FF86; }
.btn-ghost{ background:transparent; color: var(--ink); border-color: rgba(242,241,233,0.3); }
.btn-ghost:hover{ border-color: var(--ink); }

/* ---- HERO SLIDER ---- */
.hero{
  position:relative; height:100svh; min-height:560px; width:100%;
  overflow:hidden;
  background: var(--void);
}
.slide{
  position:absolute; inset:0;
  opacity:0; visibility:hidden;
  transition: opacity 1.1s ease;
}
.slide.active{ opacity:1; visibility:visible; z-index:1; }

.visual-landscape,
.visual-portrait{ position:absolute; inset:0; background-size:cover; background-position:center; }
.visual-landscape{ display:block; }
.visual-portrait{ display:none; }
@media (orientation: portrait){
  .visual-landscape{ display:none; }
  .visual-portrait{ display:block; }
}

.slide-scrim{
  position:absolute; inset:0; z-index:1;
  background: linear-gradient(100deg, rgba(8,11,9,0.94) 0%, rgba(8,11,9,0.78) 32%, rgba(8,11,9,0.35) 58%, rgba(8,11,9,0.15) 100%),
              linear-gradient(to top, rgba(6,9,7,0.9) 0%, rgba(6,9,7,0) 32%);
}
@media (orientation: portrait){
  .slide-scrim{
    background: linear-gradient(to top, rgba(6,9,7,0.96) 0%, rgba(6,9,7,0.55) 45%, rgba(6,9,7,0.25) 75%);
  }
}

.slide-svg{ position:absolute; inset:0; width:100%; height:100%; }

.hero-content{
  position:relative; z-index:2; height:100%;
  display:flex; align-items:center;
}
@media (orientation: portrait){
  .hero-content{ align-items:flex-end; padding-bottom:110px; }
}
.hero-inner{ max-width:640px; padding-top:40px; }
.eyebrow{
  display:flex; align-items:center; gap:10px;
  color: var(--flood); font-size:13px; font-weight:600;
  letter-spacing:.04em; margin-bottom:18px;
}
.eyebrow .seam-line{ width:34px; height:1px; background: var(--flood); position:relative; }
.eyebrow .seam-line::before{
  content:""; position:absolute; inset:0;
  background-image: repeating-linear-gradient(90deg, var(--flood) 0 3px, transparent 3px 7px);
}
.hero-title{ font-size: clamp(40px, 7vw, 96px); color: var(--ink); margin:0 0 22px 0; }
.hero-title .accent{ color: var(--flood); }
.hero-sub{
  font-size:17px; line-height:1.6; color: var(--ink-dim);
  max-width:480px; margin:0 0 34px 0;
}
.hero-actions{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }

.slide-index{
  position:absolute; z-index:3; left:32px; bottom:32px;
  display:flex; align-items:center; gap:14px;
}
.slide-index .num{
  font-family:'Bebas Neue',sans-serif; font-size:15px;
  color: var(--ink-dim); letter-spacing:.05em;
}
.dots{ display:flex; gap:8px; }
.dot-btn{
  width:26px; height:3px;
  background: rgba(242,241,233,0.25);
  border:none; cursor:pointer; padding:0;
  transition: background .2s ease;
}
.dot-btn.active{ background: var(--flood); }

@media (max-width:860px){
  .wrap{ padding:0 20px; }
  .slide-index{ left:20px; bottom:24px; }
}
@media (prefers-reduced-motion: reduce){
  .slide{ transition:none; }
}
</style>
</head>
<body>

<header class="nav" id="siteNav">
  <div class="wrap nav-row">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">CRICK <b>ON TIME</b></span>
    </div>
    <div class="nav-cta">
      <a href="https://t.me/+u4SlkLZNQl9hZjQ1" target="_blank" rel="noopener" class="btn btn-primary">Join for More</a>
    </div>
  </div>
</header>

<section class="hero" id="home">

  <!-- SLIDE 1 -->
  <div class="slide active" data-slide="0">
    <div class="visual-landscape"></div>
    <div class="visual-portrait"></div>
    <div class="slide-scrim"></div>
  </div>

  <!-- SLIDE 2 -->
  <div class="slide" data-slide="1">
    <div class="visual-landscape"></div>
    <div class="visual-portrait"></div>
    <div class="slide-scrim"></div>
  </div>

  <!-- SLIDE 3 -->
  <div class="slide" data-slide="2">
    <div class="visual-landscape"></div>
    <div class="visual-portrait"></div>
    <div class="slide-scrim"></div>
  </div>

  <!-- text overlay — everything comes from crick-on-time-content.json -->
  <div class="hero-content wrap">
    <div class="hero-inner">
      <div class="eyebrow"><span class="seam-line"></span> <span id="slideEyebrow">LIVE CRICKET, FREE</span></div>
      <h1 class="hero-title display" id="slideTitle"></h1>
      <p class="hero-sub" id="slideSub"></p>
      <div class="hero-actions">
        <a href="https://t.me/+u4SlkLZNQl9hZjQ1" target="_blank" rel="noopener" class="btn btn-primary" id="slideCta">Watch Now</a>
        <a href="https://t.me/+u4SlkLZNQl9hZjQ1" target="_blank" rel="noopener" class="btn btn-ghost" id="slideSecondaryCta">Join Tg</a>
      </div>
    </div>
  </div>

  <div class="slide-index">
    <span class="num">01 / 03</span>
    <div class="dots">
      <button class="dot-btn active" data-goto="0" aria-label="Slide 1"></button>
      <button class="dot-btn" data-goto="1" aria-label="Slide 2"></button>
      <button class="dot-btn" data-goto="2" aria-label="Slide 3"></button>
    </div>
  </div>
</section>

<script>
  const TELEGRAM_URL  = 'https://t.me/+u4SlkLZNQl9hZjQ1';
  const DEFAULT_TEXT  = 'Join for More';

  const slides    = document.querySelectorAll('.slide');
  const dots      = document.querySelectorAll('.dot-btn');
  const slideNum  = document.querySelector('.slide-index .num');
  const titleEl   = document.getElementById('slideTitle');
  const subEl     = document.getElementById('slideSub');
  const eyebrowEl = document.getElementById('slideEyebrow');
  const ctaEl     = document.getElementById('slideCta');
  const secCtaEl  = document.getElementById('slideSecondaryCta');

  let content = [];
  let current = 0;
  let timer   = null;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- put JSON images onto each slide ---- */
  function applySlideImages(slideData){
    slides.forEach((slide, index) => {
      const item = slideData[index];
      if (!item) return;

      const landscape = slide.querySelector('.visual-landscape');
      const portrait  = slide.querySelector('.visual-portrait');

      if (item.landscapeImage){
        landscape.style.backgroundImage = 'url("' + item.landscapeImage + '")';
        const svg = landscape.querySelector('svg');
        if (svg) svg.remove();
      }
      if (item.portraitImage){
        portrait.style.backgroundImage = 'url("' + item.portraitImage + '")';
        const svg = portrait.querySelector('svg');
        if (svg) svg.remove();
      }
    });
  }

  function goTo(i){
    slides[current].classList.remove('active');
    dots[current].classList.remove('active');

    current = i;

    slides[current].classList.add('active');
    dots[current].classList.add('active');

    slideNum.textContent =
      '0' + (current + 1) + ' / ' + String(slides.length).padStart(2, '0');

    const slide = content[current % (content.length || 1)] || {};

    eyebrowEl.textContent = slide.eyebrow || 'LIVE CRICKET, FREE';
    titleEl.innerHTML     = slide.titleHtml || slide.title || 'Live Cricket<br><span class="accent">On Time.</span>';
    subEl.textContent     = slide.subtitle || slide.sub || '';

    /* primary CTA — text & link from JSON, Telegram as fallback */
    ctaEl.textContent = slide.ctaText || DEFAULT_TEXT;
    ctaEl.href        = slide.ctaHref || TELEGRAM_URL;
    ctaEl.target      = (ctaEl.href.startsWith('http')) ? '_blank' : '_self';

    /* secondary CTA — text & link from JSON, Telegram as fallback */
    secCtaEl.textContent = slide.secondaryCtaText || DEFAULT_TEXT;
    secCtaEl.href        = slide.secondaryCtaHref || TELEGRAM_URL;
    secCtaEl.target      = (secCtaEl.href.startsWith('http')) ? '_blank' : '_self';
  }

  function next(){ goTo((current + 1) % slides.length); }

  function startAuto(ms){
    if (reduceMotion) return;
    stopAuto();
    timer = setInterval(next, ms || 5500);
  }
  function stopAuto(){ clearInterval(timer); }

  dots.forEach(btn => {
    btn.addEventListener('click', () => {
      stopAuto();
      goTo(parseInt(btn.dataset.goto, 10));
      startAuto();
    });
  });

  /* ---- nav scroll effect ---- */
  const navEl = document.getElementById('siteNav');
  window.addEventListener('scroll', () => {
    navEl.classList.toggle('scrolled', window.scrollY > 40);
  }, { passive: true });

  /* =====================================================
     FETCH HERO CONTENT FROM crick-on-time-content.json
  ====================================================== */
  fetch('crick-on-time-content.json')
    .then(response => {
      if (!response.ok){
        throw new Error('HTTP ' + response.status + ' — file not found or unreachable');
      }
      return response.json();
    })
    .then(data => {
      const hero = data.hero || {};
      const jsonSlides = Array.isArray(hero.slides) ? hero.slides : [];

      if (!jsonSlides.length){
        throw new Error('JSON loaded but hero.slides is missing or empty');
      }

      content = jsonSlides.map(s => ({
        eyebrow:          s.eyebrow   || hero.eyebrow,
        titleHtml:        s.titleHtml || s.title,
        subtitle:         s.subtitle  || s.sub,
        landscapeImage:   s.landscapeImage,
        portraitImage:    s.portraitImage,
        ctaText:          s.ctaText,
        ctaHref:          s.ctaHref,
        secondaryCtaText: s.secondaryCtaText,
        secondaryCtaHref: s.secondaryCtaHref
      }));

      applySlideImages(content);

      eyebrowEl.textContent = hero.eyebrow || content[0].eyebrow || 'LIVE CRICKET, FREE';
      goTo(0);
      startAuto(hero.autoPlayMs || 5500);
    })
    .catch(error => {
      console.error('JSON load failed:', error);

      /* visible red badge so you can SEE the reason on the page */
      const badge = document.createElement('div');
      badge.style.cssText =
        'position:fixed;bottom:12px;right:12px;z-index:999;' +
        'background:#C8102E;color:#fff;padding:10px 14px;font-size:12px;' +
        'border-radius:4px;max-width:340px;font-family:monospace;line-height:1.5';
      let hint = '';
      if (location.protocol === 'file:'){
        hint = '<br><b>You opened this via file:// — fetch() is blocked.</b> Use a local server (VS Code Live Server, or run: python -m http.server)';
      }
      badge.innerHTML = '<b>JSON error:</b> ' + error.message + hint;
      document.body.appendChild(badge);

      /* fallback text so the hero is never empty */
      titleEl.innerHTML = 'Every Ball.<br>Every Match.<br><span class="accent">On Time.</span>';
      subEl.textContent = 'Live cricket streams — join our Telegram for links.';
    });
</script>

</body>
</html>
